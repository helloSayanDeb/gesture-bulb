<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Bulb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom glow animations */
      @keyframes pulse-glow {
        0%, 100% { filter: drop-shadow(0 0 40px rgba(255, 204, 0, 0.6)); }
        50% { filter: drop-shadow(0 0 60px rgba(255, 204, 0, 0.8)); }
      }
      .bulb-on {
        animation: pulse-glow 3s infinite ease-in-out;
      }
    </style>
    <!-- TensorFlow.js and Models (loaded as globals to avoid ESM export issues) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.10.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.10.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.10.0/dist/tf-converter.min.js"></script>
    <!-- We include mediapipe hands just in case the model tries to sniff for it, though using tfjs runtime -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.16/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js"></script>

    <script type="importmap">
{
  "imports": {
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body class="bg-gray-900 text-white overflow-hidden">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
