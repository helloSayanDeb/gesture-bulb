<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Bulb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
      :root {
        --font-display: 'Syne', sans-serif;
        --font-body: 'DM Sans', sans-serif;
      }
      
      body {
        font-family: var(--font-body);
        background-color: #000000;
        color: #ffffff;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-display);
      }

      /* Custom glow animations */
      @keyframes pulse-glow {
        0%, 100% { filter: drop-shadow(0 0 40px rgba(255, 204, 0, 0.6)); }
        50% { filter: drop-shadow(0 0 60px rgba(255, 204, 0, 0.8)); }
      }
      .bulb-on {
        animation: pulse-glow 3s infinite ease-in-out;
      }

      /* Metallic Sheen Animation */
      .metallic-sheen {
        position: relative;
        overflow: hidden;
      }
      .metallic-sheen::after {
        content: '';
        position: absolute;
        top: 0;
        left: -150%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to right,
          transparent 0%,
          rgba(255, 255, 255, 0.1) 50%,
          transparent 100%
        );
        transform: skewX(-25deg);
        transition: none;
      }
      .metallic-sheen:hover::after {
        left: 150%;
        transition: left 0.7s ease-in-out;
      }
    </style>
    <!-- TensorFlow.js and Models (loaded as globals to avoid ESM export issues) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.10.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.10.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.10.0/dist/tf-converter.min.js"></script>
    <!-- We include mediapipe hands just in case the model tries to sniff for it, though using tfjs runtime -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.16/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js"></script>

    <script type="importmap">
{
  "imports": {
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body class="bg-black text-white overflow-hidden">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
